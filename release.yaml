# NarrChat 版本号管理文件（版本号唯一来源）
#
# 修改此文件后：
#  - 「关于」面板会显示 version 字段；
#  - tool/build_release.dart 会用 version 命名产物，并用 build 作为 Android versionCode；
#  - tool/build_release.dart 每次构建前会自动把 build +1，并同步 pubspec.yaml 的
#    version 字段为 `{version}+{build}`（无需手动维护）。
#
# version: 语义化版本号（显示用，如 1.2.3）
# build:   构建号（Android versionCode，每次发布递增）
version: 1.3.0
build: 27